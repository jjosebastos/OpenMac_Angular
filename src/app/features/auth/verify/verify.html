<div class="w-full max-w-md flex flex-col gap-6 bg-white p-8 rounded-3xl border border-neutral-200 shadow-sm animate-fade-in">
  
  <div class="flex flex-col gap-2 items-center text-center">
    <h3 class="text-3xl font-bold tracking-tight text-neutral-900">Verificação de código</h3>
    <p class="text-sm text-neutral-500 max-w-[280px]">
      Insira o código de 6 dígitos enviado para o seu e-mail corporativo.
    </p>
  </div>

  <div class="flex justify-between gap-2 my-2">
    <input #box1 (keyup)="manipularFoco($event, null, box2)" type="text" maxlength="1" inputmode="numeric" autocomplete="one-time-code"
      class="w-12 h-14 text-center text-2xl font-bold border-2 border-neutral-200 rounded-xl focus:border-neutral-900 focus:outline-none bg-neutral-50 focus:bg-white transition-all">
    
    <input #box2 (keyup)="manipularFoco($event, box1, box3)" type="text" maxlength="1" inputmode="numeric"
      class="w-12 h-14 text-center text-2xl font-bold border-2 border-neutral-200 rounded-xl focus:border-neutral-900 focus:outline-none bg-neutral-50 focus:bg-white transition-all">
    
    <input #box3 (keyup)="manipularFoco($event, box2, box4)" type="text" maxlength="1" inputmode="numeric"
      class="w-12 h-14 text-center text-2xl font-bold border-2 border-neutral-200 rounded-xl focus:border-neutral-900 focus:outline-none bg-neutral-50 focus:bg-white transition-all">
    
    <input #box4 (keyup)="manipularFoco($event, box3, box5)" type="text" maxlength="1" inputmode="numeric"
      class="w-12 h-14 text-center text-2xl font-bold border-2 border-neutral-200 rounded-xl focus:border-neutral-900 focus:outline-none bg-neutral-50 focus:bg-white transition-all">
    
    <input #box5 (keyup)="manipularFoco($event, box4, box6)" type="text" maxlength="1" inputmode="numeric"
      class="w-12 h-14 text-center text-2xl font-bold border-2 border-neutral-200 rounded-xl focus:border-neutral-900 focus:outline-none bg-neutral-50 focus:bg-white transition-all">
    
    <input #box6 (keyup)="manipularFoco($event, box5, null)" type="text" maxlength="1" inputmode="numeric"
      class="w-12 h-14 text-center text-2xl font-bold border-2 border-neutral-200 rounded-xl focus:border-neutral-900 focus:outline-none bg-neutral-50 focus:bg-white transition-all">
  </div>

  <button 
    (click)="enviarCodigoAgrupado(box1.value, box2.value, box3.value, box4.value, box5.value, box6.value)"
    class="w-full bg-neutral-900 text-white font-semibold py-3.5 rounded-xl hover:bg-neutral-800 transition-colors shadow-sm tracking-wide"
  >
    Verificar Acesso
  </button>

  <div class="text-center text-sm border-t border-neutral-100 pt-4">
    <span class="text-neutral-500">Não recebeu seu código? </span>
    <button 
      type="button"
      (click)="dispararReenvio()" 
      class="font-semibold text-neutral-900 hover:underline focus:outline-none transition-all"
    >
      Reenviar e-mail
    </button>
  </div>
</div>
